name: "Security Pipeline v2.2 - Full SOC Integration & Hardening"

on:
  push:
    branches: [ "principal" ]
  pull_request:
    branches: [ "principal" ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  security-and-hardening:
    name: Full SecOps Pipeline (T1078, T1190, T1059)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks - T1078
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        id: gitleaks_scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --source . --redact --format sarif --report-path gitleaks-results.sarif --no-banner -v

      - name: Upload Gitleaks SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gitleaks-results.sarif

      - name: Run Trivy Scanner - T1190
        uses: aquasecurity/trivy-action@0.33.1
        continue-on-error: true
        id: trivy_scan
        with:
          scan-type: 'fs'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Generate Wazuh SIEM JSON Events
        if: always()
        run: |
          > wazuh-alerts.json
          if [ -s gitleaks-results.sarif ]; then
            jq -c '.runs[].results[]? | {integration:"soc_pipeline_scan",scanner:"gitleaks",mitre:"T1078",rule_id:.ruleId,severity:"critical",message:.message.text,file:.locations[0].physicalLocation.artifactLocation.uri}' gitleaks-results.sarif >> wazuh-alerts.json || true
          fi
          if [ -s trivy-results.sarif ]; then
            jq -c '.runs[].results[]? | {integration:"soc_pipeline_scan",scanner:"trivy",mitre:"T1190",rule_id:.ruleId,severity:.level,message:.message.text,file:.locations[0].physicalLocation.artifactLocation.uri}' trivy-results.sarif >> wazuh-alerts.json || true
          fi
          cat wazuh-alerts.json || echo "Repo limpio - 0 alertas"

      - name: Enforce Gates SOC 0-Alertas
        if: always()
        run: |
          GITLEAKS_COUNT=$(jq '[.runs[].results[]?] | length' gitleaks-results.sarif)
          TRIVY_COUNT=$(jq '[.runs[].results[]?] | length' trivy-results.sarif)
          TOTAL=$((GITLEAKS_COUNT + TRIVY_COUNT))
          echo "Gitleaks: $GITLEAKS_COUNT | Trivy: $TRIVY_COUNT"
          if [ "$TOTAL" -gt 0 ]; then
            echo "::error::SOC Policy Violation: $TOTAL hallazgos"
            exit 1
          fi
