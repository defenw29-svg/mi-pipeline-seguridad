name: "Security Pipeline v2.1 - SOC L1 Remediation"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  secret-scan:
    name: 1. Secret Audit (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Fuerza a Gitleaks a escribir el reporte SARIF y mantiene el modo estricto de bloqueo
          format: sarif
          report-path: gitleaks-results.sarif

      - name: Upload Gitleaks SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always() # Asegura que la evidencia se suba aunque se detecten secretos
        with:
          sarif_file: gitleaks-results.sarif

  static-analysis:
    name: 2. CodeQL SAST Analysis
    runs-on: ubuntu-latest
    needs: secret-scan # Mantiene el bloqueo si Gitleaks encuentra un secreto expuesto
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript' ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  dependency-scan:
    name: 3. Dependency Audit (Trivy)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Scanner
        uses: aquasecurity/trivy-action@v1.0.0 # Actualizado a versión estable y segura
        with:
          scan-type: 'fs'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          # Eliminamos el exit-code '1' de aquí para permitir que termine de escribir el SARIF de forma limpia

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Enforce Gates (SOC Tier 1/2 Policy)
        run: |
          # Este paso técnico analiza el SARIF generado de forma limpia. 
          # Si contiene hallazgos de vulnerabilidades, rompe el pipeline AQUÍ, cumpliendo la política de 0 alertas.
          if grep -q '"severity": "error"' trivy-results.sarif || grep -q '"level": "error"' trivy-results.sarif; then
            echo "[-] SOC Policy Violation: Vulnerabilidades críticas/altas detectadas en dependencias."
            exit 1
          fi
