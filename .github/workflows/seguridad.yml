name: "Security Pipeline v3.2 - Full SOC Integration (Final Sin Truncamiento)"

on:
  push:
    branches: [ "main", "principal" ]
  pull_request:
    branches: [ "main", "principal" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  statuses: read
  code-scanning: read

jobs:
  security-and-hardening:
    name: Full SecOps Pipeline (T1078, T1190, T1059)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL (SAST)
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, python
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:multi"

      - name: Download REAL CodeQL SARIF via GH CLI
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Sync con Code Scanning API..."
          sleep 12
          REF_PATH="${{ github.ref }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REF_PATH="refs/heads/${{ github.head_ref }}"
          fi
          if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            echo "::warning::PR Fork - CodeQL no accesible, solo Gitleaks+Trivy"
            echo '{"version":"2.1.0","runs":[{"results":[]}]}' > codeql-results.sarif
            exit 0
          fi
          ANALYSIS_ID=$(gh api "repos/${{ github.repository }}/code-scanning/analyses?tool_name=CodeQL&ref=$REF_PATH&per_page=1" --jq '.[0].id // empty' 2>&1 || true)
          if echo "$ANALYSIS_ID" | grep -qi "403\|401"; then
            echo '{"version":"2.1.0","runs":[{"results":[{"ruleId":"infra-403","level":"error"}]}]}' > codeql-results.sarif
            exit 0
          fi
          if [ -z "$ANALYSIS_ID" ] || [ "$ANALYSIS_ID" = "null" ]; then
            echo '{"version":"2.1.0","runs":[{"results":[]}]}' > codeql-results.sarif
          else
            gh api -H "Accept: application/sarif+json" "repos/${{ github.repository }}/code-scanning/analyses/$ANALYSIS_ID" > codeql-results.sarif
            jq -e '.runs' codeql-results.sarif > /dev/null 2>&1 || echo '{"version":"2.1.0","runs":[{"results":[]}]}' > codeql-results.sarif
          fi

      - name: Run Gitleaks - T1078
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --source. --redact --format sarif --report-path gitleaks-results.sarif --no-banner -v

      - name: Upload Gitleaks SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('gitleaks-results.sarif') != ''
        with:
          sarif_file: gitleaks-results.sarif

      - name: Run Trivy Scanner - T1190
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Generate SBOM + Wazuh SIEM JSON
        if: always()
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy fs --format cyclonedx --output sbom.json .
          > wazuh-alerts.json
          for f in gitleaks-results.sarif trivy-results.sarif codeql-results.sarif; do
            [ -s "$f" ] && jq -c --arg s "$f" --arg c "${{ github.sha }}" --arg a "${{ github.actor }}" '.runs[]?.results[]? | select(.!=null) | {integration:"soc_pipeline_scan",scanner:$s,commit:$c,actor:$a,mitre:(if $s|contains("gitleaks") then "T1078" elif $s|contains("trivy") then "T1190" else "T1059" end),rule_id:(.ruleId//"unknown"),severity:(.level//"high"),file:(.locations[0].physicalLocation.artifactLocation.uri//"unknown")}' "$f" >> wazuh-alerts.json 2>/dev/null || true
          done

      - name: Upload Artifacts for SOC Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soc-evidence
          retention-days: 30
          path: |
            wazuh-alerts.json
            sbom.json
            *results.sarif

      - name: Enforce Gates SOC 0-Alertas
        if: always()
        run: |
          count vuln() { f=$1; [ -f "$f" ] || { echo 0; return; }; jq '[.runs[]?.results[]? | select(.ruleId!="infra-403")] | length' "$f" 2>/dev/null | tr -d '\n\r ' || echo 0; }
          count infra() { f=$1; [ -f "$f" ] || { echo 0; return; }; jq '[.runs[]?.results[]? | select(.ruleId=="infra-403")] | length' "$f" 2>/dev/null | tr -d '\n\r ' || echo 0; }
          GITLEAKS_COUNT=$(count vuln gitleaks-results.sarif)
          TRIVY_COUNT=$(count vuln trivy-results.sarif)
          CODEQL_COUNT=$(count vuln codeql-results.sarif)
          INFRA_COUNT=$(($(count infra gitleaks-results.sarif) + $(count infra trivy-results.sarif) + $(count infra codeql-results.sarif)))
          GITLEAKS_COUNT=$(echo "$GITLEAKS_COUNT" | grep -Eo '[0-9]+' | head -1); GITLEAKS_COUNT=${GITLEAKS_COUNT:-0}
          TRIVY_COUNT=$(echo "$TRIVY_COUNT" | grep -Eo '[0-9]+' | head -1); TRIVY_COUNT=${TRIVY_COUNT:-0}
          CODEQL_COUNT=$(echo "$CODEQL_COUNT" | grep -Eo '[0-9]+' | head -1); CODEQL_COUNT=${CODEQL_COUNT:-0}
          TOTAL=$((GITLEAKS_COUNT + TRIVY_COUNT + CODEQL_COUNT))
          echo "SOC Gate: Gitleaks T1078=$GITLEAKS_COUNT Trivy T1190=$TRIVY_COUNT CodeQL T1059=$CODEQL_COUNT Total=$TOTAL Infra=$INFRA_COUNT"
          if [ "$INFRA_COUNT" -gt 0 ]; then echo "::error::SOC Infra Failure 403"; exit 1; fi
          if [ "$TOTAL" -gt 0 ]; then echo "::error::SOC Policy Violation $TOTAL vulns"; exit 1; fi
          echo "SOC Gate OK - 0 alertas"
