name: "Security Pipeline v2.1 - SOC L1 Remediation"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  secret-scan:
    name: 1. Secret Audit (Gitleaks) - T1078
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Corregido el espacio en '--source .' para evitar fallos de sintaxis del binario
          args: detect --source . --redact --format sarif --report-path gitleaks-results.sarif --no-banner -v

      - name: Upload Gitleaks SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gitleaks-results.sarif

  static-analysis:
    name: 2. CodeQL SAST - T1190
    runs-on: ubuntu-latest
    needs: secret-scan
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript' ]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  dependency-scan:
    name: 3. Dependency Audit (Trivy) - T1190
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy Scanner
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: 'fs'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Enforce Gates SOC 0-Alertas
        if: always()
        run: |
          # Control de seguridad: Si por algún motivo el archivo no se generó o está vacío, no se salta el control
          if [ ! -s trivy-results.sarif ]; then
            echo "::error::SOC Error: El reporte SARIF de Trivy no se ha generado correctamente."
            exit 1
          fi
          
          # Se añade el operador '?' a '.results[]?' para prevenir que jq rompa el flujo si el array viene nulo (0 vulnerabilidades)
          COUNT=$(jq '[.runs[].results[]?] | length' trivy-results.sarif)
          
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::SOC Policy Violation: $COUNT vulns CRITICAL/HIGH detectadas en dependencias."
            exit 1
          else
            echo "[+] SOC Compliance: 0 Vulnerabilidades detectadas. Gate autorizado."
          fi
