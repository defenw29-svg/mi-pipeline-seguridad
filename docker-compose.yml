version: '3.8'
services:
  # --- SIEM Local idéntico a prod ---
  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.8.0
    environment:
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer

  wazuh-manager:
    image: wazuh/wazuh-manager:4.8.0
    depends_on:
      - wazuh-indexer
    environment:
      - INDEXER_URL=https://wazuh-indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
    ports:
      - "1514:1514"
      - "1515:1515"
      - "55000:55000"
    volumes:
      - ./wazuh/wazuh_logs:/var/ossec/logs
      - ./wazuh-alerts.json:/var/ossec/logs/alerts/soc-pipeline.json:ro

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.8.0
    depends_on:
      - wazuh-indexer
    ports:
      - "5601:5601"
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - WAZUH_API_URL=https://wazuh-manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=kibanaserver

  # --- Runner efímero que ejecuta tu v3.4 igual que GitHub ---
  secops-runner:
    image: aquasec/trivy:latest
    container_name: soc-pipeline-runner
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    entrypoint: ["/bin/sh", "./scripts/run-pipeline-local.sh"]
    depends_on:
      - wazuh-manager
    environment:
      - GH_TOKEN=${GH_TOKEN} # exporta tu gh token para probar CodeQL real
      - REPO_PATH=/workspace

volumes:
  wazuh-indexer-data:
